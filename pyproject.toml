[project]
name = "aipg-grid-core"
version = "1.0.0"
description = "AI Power Grid coordinator and public Grid API."
authors = [
    {name = "AI Power Grid"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "SQLAlchemy~=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    "sse-starlette>=2.0.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "boto3>=1.33.7",
    "pillow>=10.0.1",
    "prometheus-client>=0.20.0",
    "tiktoken>=0.7.0",
    "eth-account==0.13.7",
    "web3>=6.0.0",
    "google-auth>=2.29,<3",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.urls]
"Homepage" = "https://aipowergrid.io"
"Documentation" = "https://docs.aipowergrid.io"
"Source" = "https://github.com/AIPowerGrid/grid-core"

[tool.setuptools.packages.find]
include = ["grid_api*"]

[tool.ruff]
line-length = 140
select = [
  #"A",
  "I",
  "E",
  "W",
  "F",
  "UP",
  "YTT",
  #"B",
  #"C4",
  "PIE",
  #"RET",
  #"SIM",
  "COM",
  # "D",
  #"ANN"
  ]
ignore = [
  "ANN101",
  "ANN102",
  # Ignore D rules for non-google docstring standard
  "D203",
  "D204",
  "D213",
  "D215",
  "D400",
  "D404",
  "D406",
  "D407",
  "D408",
  "D409",
  "D413",]


[tool.black]
line-length = 140
include = '\.pyi?$'
