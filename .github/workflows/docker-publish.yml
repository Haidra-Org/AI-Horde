name: Docker image publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-test-python/**'
      - '.github/actions/start-test-stack/**'
      - '.github/workflows/docker-publish.yml'
      - 'tests/docker-compose.yml'
      - 'tests/garage/**'
      - 'tests/stress/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # Build, push, and validate both runtime image variants:
  #   default   -> ghcr.io/haidra-org/ai-horde:<tag>
  #   telemetry -> ghcr.io/haidra-org/ai-horde:<tag>-telemetry
  # The telemetry variant installs the telemetry-profiling dependency group so
  # deployments can safely run with PYROSCOPE_ENABLED=true.
  # -----------------------------------------------------------
  build-push-and-validate:
    name: Build, publish, and validate (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            tag_suffix: ""
            dependency_groups: ""
            profiling_expected: "false"
          - variant: telemetry
            tag_suffix: "-telemetry"
            dependency_groups: "telemetry-profiling"
            profiling_expected: "true"
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-test-python
        with:
          python-version: '3.13'

      - uses: ./.github/actions/start-test-stack

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AI_HORDE_DEPENDENCY_GROUPS=${{ matrix.dependency_groups }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Pull published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME_LC: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE="$(echo "$IMAGE_NAME_LC" | tr '[:upper:]' '[:lower:]')@${{ steps.build.outputs.digest }}"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "ai-horde-${{ matrix.variant }}:validate"
          echo "Pulled $IMAGE"

      - name: Tag PR image for validation
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          docker tag "$IMAGE" "ai-horde-${{ matrix.variant }}:validate"

      - name: Assert profiling dependency split
        run: |
          if [ "${{ matrix.profiling_expected }}" = "true" ]; then
            docker run --rm "ai-horde-${{ matrix.variant }}:validate" \
              python -c "import pyroscope, pyroscope.otel"
          else
            docker run --rm "ai-horde-${{ matrix.variant }}:validate" \
              python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('pyroscope') is None else 1)"
          fi

      # -- Common: run the container and health-check ----------
      - name: Start AI-Horde container
        run: |
          docker run -d --name "ai-horde-validate-${{ matrix.variant }}" \
            --network host \
            -e POSTGRES_URL \
            -e PGUSER \
            -e PGPASSWORD \
            -e REDIS_IP \
            -e REDIS_PORT \
            -e REDIS_SERVERS \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION \
            -e SHARED_AWS_ACCESS_ID \
            -e SHARED_AWS_ACCESS_KEY \
            -e R2_TRANSIENT_ACCOUNT \
            -e R2_PERMANENT_ACCOUNT \
            -e R2_TRANSIENT_BUCKET \
            -e R2_PERMANENT_BUCKET \
            -e R2_SOURCE_IMAGE_BUCKET \
            -e USE_SQLITE=0 \
            -e 'ADMINS=["test_user#1"]' \
            -e KUDOS_TRUST_THRESHOLD=100 \
            -e HORDE_TEST_APIKEYS=1 \
            -e AI_HORDE_TELEMETRY_ENABLED="${{ matrix.profiling_expected }}" \
            -e PYROSCOPE_ENABLED="${{ matrix.profiling_expected }}" \
            -e PYROSCOPE_SPAN_PROFILES="${{ matrix.profiling_expected }}" \
            -e PYROSCOPE_SPAN_PROFILES_SAMPLE_RATE=0.10 \
            "ai-horde-${{ matrix.variant }}:validate"

      - name: Wait for healthy heartbeat
        run: |
          timeout=120
          while ! curl -sf http://localhost:7001/api/v2/status/heartbeat > /dev/null 2>&1; do
            timeout=$((timeout - 2))
            if [ "$timeout" -le 0 ]; then
              echo "::error::Image failed to pass health check within ${timeout}s"
              docker logs "ai-horde-validate-${{ matrix.variant }}"
              exit 1
            fi
            sleep 2
          done
          echo "Image validation passed; heartbeat responded OK"

      - name: Assert telemetry image initialized native profiling and span correlation
        if: matrix.profiling_expected == 'true'
        run: >-
          docker logs "ai-horde-validate-${{ matrix.variant }}" 2>&1 |
          grep -F "Pyroscope span profiles (baseline 10.00%)"

      - name: Run mixed Locust suite against built image
        run: |
          uv run locust -f tests/stress/locustfile.py \
            --host http://localhost:7001 \
            --headless \
            --users 24 \
            --spawn-rate 6 \
            --run-time 90s \
            --bootstrap-requestors 4 \
            --bootstrap-workers 8 \
            --legacy-image-workers 1 \
            --extended-image-workers 1 \
            --sampler-feature-requestors 1 \
            --preflight-fail-hard \
            --bootstrap-fail-hard \
            --csv "image-${{ matrix.variant }}" \
            --exit-code-on-error 0 \
            --only-summary

      - name: Gate built image on crash-class failures
        run: >-
          uv run python tests/stress/check_smoke_results.py
          --stats "image-${{ matrix.variant }}_stats.csv"
          --failures "image-${{ matrix.variant }}_failures.csv"

      - name: Capture built image logs
        if: always()
        run: >-
          docker logs "ai-horde-validate-${{ matrix.variant }}"
          > "image-${{ matrix.variant }}-server.log" 2>&1 || true

      - name: Upload built-image Locust artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-${{ matrix.variant }}-locust-artifacts
          path: |
            image-${{ matrix.variant }}-server.log
            image-${{ matrix.variant }}_stats.csv
            image-${{ matrix.variant }}_failures.csv
            image-${{ matrix.variant }}_stats_history.csv
          if-no-files-found: ignore

      - name: Dump container logs on failure
        if: failure()
        run: docker logs "ai-horde-validate-${{ matrix.variant }}" 2>&1 || true

      - name: Stop image and local test stack
        if: always()
        run: |
          docker rm -f "ai-horde-validate-${{ matrix.variant }}" 2>/dev/null || true
          docker compose -f tests/docker-compose.yml down
