services:
  grid-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aipowergrid/grid-core:local
    restart: unless-stopped
    ports:
      - "7002:7002"
    environment:
      POSTGRES_USER: aipg
      POSTGRES_PASS: local-grid-only
      POSTGRES_URL: postgres:5432/aipg_grid
      REDIS_IP: redis
      REDIS_PORT: "6379"
      REDIS_STREAM_DB: "7"
      GRID_API_HOST: 0.0.0.0
      GRID_API_PORT: "7002"
      GRID_SALT: local-grid-salt-change-before-sharing
      GRID_USER_TOKEN_SIGNING_KEY: local-grid-token-key-change-before-sharing
      GRID_CHARGING_ENABLED: "0"
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn grid_api.main:app --host 0.0.0.0 --port 7002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7002/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: aipg
      POSTGRES_PASSWORD: local-grid-only
      POSTGRES_DB: aipg_grid
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipg -d aipg_grid"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
