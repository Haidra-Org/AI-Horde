# nginx site for api.aipowergrid.io
#
# Public URL scheme:
#   /v1/*                         -> Grid API (uvicorn :7010)
#   /, /health, /docs, /openapi   -> Grid API
#   /api/v2/* and /v2/*           -> static 410 retirement response
#   /metrics                      -> Grid API, localhost only
#
# TLS is normally terminated at Cloudflare. If nginx terminates TLS directly,
# install the equivalent locations in the HTTPS server block as well.

upstream aipg_gridapi {
    server 127.0.0.1:7010;
}

server {
    listen 80;
    server_name api.aipowergrid.io;

    client_max_body_size 64m;

    location /v1/ {
        proxy_pass http://aipg_gridapi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # FastAPI's public discovery and operator endpoints live outside /v1.
    location = / {
        proxy_pass http://aipg_gridapi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://aipg_gridapi;
        proxy_set_header Host $host;
    }
    location = /docs {
        proxy_pass http://aipg_gridapi;
        proxy_set_header Host $host;
    }
    location = /redoc {
        proxy_pass http://aipg_gridapi;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://aipg_gridapi;
        proxy_set_header Host $host;
    }

    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://aipg_gridapi;
    }

    # Keep a deterministic migration response without keeping retired code,
    # processes, Redis databases, or credentials alive.
    location = /v2 {
        default_type application/json;
        return 410 '{"status":"gone","message":"The legacy /v2 API has been retired. Use https://api.aipowergrid.io/v1."}';
    }
    location /v2/ {
        default_type application/json;
        return 410 '{"status":"gone","message":"The legacy /v2 API has been retired. Use https://api.aipowergrid.io/v1."}';
    }
    location = /api/v2 {
        default_type application/json;
        return 410 '{"status":"gone","message":"The legacy /api/v2 API has been retired. Use https://api.aipowergrid.io/v1."}';
    }
    location /api/v2/ {
        default_type application/json;
        return 410 '{"status":"gone","message":"The legacy /api/v2 API has been retired. Use https://api.aipowergrid.io/v1."}';
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }
}
